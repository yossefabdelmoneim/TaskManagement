<header class="navbar">
  <a routerLink="/projects" class="navbar-brand">TaskBoard</a>

  <nav class="navbar-links">
    @if (isAuthenticated()) {
      <a routerLink="/projects" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Projects
      </a>
      <a routerLink="/projects/new">New Project</a>
      <button type="button" class="btn btn-outline btn-sm" (click)="onLogout()">Log out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Sign in</a>
      <a routerLink="/register" routerLinkActive="active">Sign up</a>
    }
  </nav>
</header>
